<!DOCTYPE html>
<html lang="es">

<head>

    <meta
        name="google-site-verification"
        content="Gsg02YKES8nmffacm-HUekW7cojT1oLdIx6sP7xKTgY"
    >

    <meta
        name="description"
        content="PKGX Store — aplicaciones, herramientas, utilidades y contenido para tu consola."
    >

    <meta
        name="keywords"
        content="PKGX Store, PS4, homebrew, aplicaciones, herramientas, utilidades, emuladores"
    >

    <meta
        name="author"
        content="PKGX Store"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PKGX Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="header">

    <a
        href="#"
        class="logo"
    >
        PKGX<span>STORE</span>
    </a>


    <nav class="header-links">

        <a href="#inicio">
            Inicio
        </a>

        <a href="#apps">
            Aplicaciones
        </a>

    </nav>

</header>



<section
    class="hero"
    id="inicio"
>

    <div class="hero-content">

        <small>
            PKGX STORE
        </small>

        <h1>
            Aplicaciones.<br>
            <span>En un solo lugar.</span>
        </h1>

        <p>
            Explora aplicaciones, herramientas y utilidades
            organizadas en un catálogo sencillo y moderno.
        </p>

        <a
            href="#apps"
            class="hero-button"
        >
            Explorar aplicaciones
        </a>

    </div>

</section>



<section
    class="toolbar"
    id="apps"
>

    <input
        id="searchInput"
        type="search"
        placeholder="Buscar una aplicación..."
        autocomplete="off"
    >


    <select id="categoryFilter">

        <option value="">
            Todas las categorías
        </option>

    </select>

</section>



<main
    id="appsGrid"
    class="apps-grid"
>

    <div class="loading">
        Cargando aplicaciones...
    </div>

</main>



<footer class="footer">

    © 2026 PKGX Store · Aplicaciones y herramientas.

</footer>



<script src="script.js"></script>

</body>

</html>
